manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.google-workspace
kind: tool_provider
version: 0.2.0
display_name: Google Workspace
description: Project-scoped Gmail, Drive, and Sheets access using project-scoped Google OAuth application credentials.
vendor: {name: Flow Steward}
listing:
  category: productivity
  tags: [google, gmail, drive, sheets, email, files, spreadsheets]
  summary: Connect multiple Google accounts explicitly to Gmail, Drive, and Sheets workflows.
features: [tool, action]
required_scopes: [extension:invoke, artifact:read, artifact:write]
account_scope:
  scope_type: project
  description: Google service grants and tokens are connection-local within each project.
external_effects:
  - {operation_id: set_message_flags, effect_kind: mailbox_message_update, channel: gmail, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: move_messages, effect_kind: mailbox_message_move, channel: gmail, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: delete_messages, effect_kind: mailbox_message_trash, channel: gmail, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: upload_drive_file, effect_kind: drive_file_create, channel: google_drive, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: write_google_sheet, effect_kind: spreadsheet_write, channel: google_sheets, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: append_google_sheet_rows, effect_kind: spreadsheet_append, channel: google_sheets, idempotency: required, test_mode_behavior: suppress}
runtime:
  extension_contract_v2:
    oauth_providers:
      - provider_id: workspace_oauth
        display_name: Google Workspace
        description: Google OAuth application credentials and project-scoped Workspace account authorization.
        setup_page_id: setup-guide
        help_page_id: setup-guide
        error_help_anchors:
          invalid_client: client-credentials
          authorization_required: authorize-again
          provider_unavailable: google-api-setup
        flow: {type: authorization_code, pkce: s256}
        credential_fields:
          - {field_id: client_id, value_type: text, required: true, secret: false, browser_exposable: true, change_policy: reauthorization_required, label: Google OAuth Client ID, help_text: Enter the Web application OAuth client ID from Google Cloud., autocomplete: username, validation: {min_length: 1, max_length: 512}}
          - {field_id: client_secret, value_type: secret, required: true, secret: true, change_policy: runtime_revalidate, label: Google OAuth Client Secret, help_text: Enter the matching OAuth client secret from Google Cloud., autocomplete: current-password, validation: {min_length: 1, max_length: 4096}}
          - {field_id: picker_api_key, value_type: text, required: false, secret: false, browser_exposable: true, change_policy: runtime_revalidate, label: Picker API key, help_text: Optional. Required only to enable Google Picker shortcuts for Drive and Sheets., autocomplete: "off", validation: {min_length: 1, max_length: 512}}
          - {field_id: picker_app_id, value_type: text, required: false, secret: false, browser_exposable: true, change_policy: runtime_revalidate, label: Picker App ID, help_text: Optional. Required only to enable Google Picker shortcuts for Drive and Sheets., autocomplete: "off", validation: {min_length: 1, max_length: 64}}
          - {field_id: picker_origin, value_type: text, required: false, secret: false, browser_exposable: true, change_policy: runtime_revalidate, label: Picker browser origin, help_text: Optional. Required only to enable Google Picker shortcuts for Drive and Sheets., placeholder: https://flow-steward.example, autocomplete: "off", validation: {type: https_origin, min_length: 9, max_length: 2048}}
        authorization_endpoint: {url: https://accounts.google.com/o/oauth2/v2/auth}
        token_endpoint: {url: https://oauth2.googleapis.com/token, client_auth_method: client_secret_post}
        revocation_endpoint: {url: https://oauth2.googleapis.com/revoke}
        callback_id: oauth_authorization
        authorization_intents:
          - intent_id: gmail_connect
            static_parameters: {access_type: offline, include_granted_scopes: false, prompt: consent select_account}
            user_inputs:
              - {input_id: email_hint, parameter: login_hint, validation: {type: email, max_length: 320}}
          - intent_id: drive_connect
            static_parameters: {access_type: offline, include_granted_scopes: false, prompt: consent select_account}
            user_inputs:
              - {input_id: email_hint, parameter: login_hint, validation: {type: email, max_length: 320}}
          - intent_id: sheets_connect
            static_parameters: {access_type: offline, include_granted_scopes: false, prompt: consent select_account}
            user_inputs:
              - {input_id: email_hint, parameter: login_hint, validation: {type: email, max_length: 320}}
        post_connect_action_id: verify_google_identity
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    resource_query_manifest: contracts/resource_queries.yaml
    artifact_policies: contracts/artifact_policies.yaml
artifact_policies:
  - operation_id: get_attachment
    outputs:
      - {kind: artifact, value_type: artifact_handle, binding_key: attachment_artifact_handle, filename: gmail-attachment.bin, content_type: application/octet-stream, max_size_bytes: 20971520, retention_class: run_window}
  - operation_id: download_drive_file
    outputs:
      - {kind: artifact, value_type: artifact_handle, binding_key: drive_download_artifact, filename: drive-download.bin, content_type: application/octet-stream, max_size_bytes: 209715200, max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES, retention_class: run_window}
  - operation_id: upload_drive_file
    inputs:
      - {kind: artifact, value_type: artifact_handle, binding_key: drive_upload_artifact, from_input: artifact_handle, max_size_bytes: 209715200, max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES}
  - operation_id: read_google_sheet
    outputs:
      - {kind: dataset, value_type: dataset_handle, binding_key: google_sheet_dataset, content_type: application/x-ndjson, max_size_bytes: 209715200, retention_class: run_window}
  - operation_id: write_google_sheet
    inputs:
      - {kind: dataset, value_type: dataset_handle, binding_key: google_sheet_input_dataset, from_input: dataset_handle, required: false, content_type: application/x-ndjson, max_size_bytes: 209715200}
  - operation_id: append_google_sheet_rows
    inputs:
      - {kind: dataset, value_type: dataset_handle, binding_key: google_sheet_input_dataset, from_input: dataset_handle, required: false, content_type: application/x-ndjson, max_size_bytes: 209715200}
entrypoint:
  mode: subprocess
  command: [python3, main.py]
  timeout_policy: {env: FS_EXTENSION_OPERATION_TIMEOUT_SECONDS, default_seconds: 300, minimum_seconds: 30, maximum_seconds: 3600, headroom_seconds: 30}
health: {command: [python3, health.py], timeout_seconds: 5}
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
callbacks:
  - {callback_id: oauth_authorization, purpose: oauth_authorization, methods: [GET], connection_scoped: false}
python_requirements: []
