forms:
  - {operation_id: test_connection, title: Test Gmail connection, fields: []}
  - {operation_id: list_labels, title: List Gmail labels, fields: []}
  - operation_id: search_messages
    title: Search Gmail messages
    fields: [{name: label_id, widget_type: resource_picker, resource_query_id: gmail_labels, required: true, help_text: "Select the Gmail label to search, such as INBOX.", label: "Label id"}, {name: filters, widget_type: json, help_text: "JSON object using from, to, cc, subject, text, rfc_message_id, since/before (YYYY-MM-DD), read_state (any/read/unread), star_state (any/starred/unstarred), attachment_state (any/with_attachments/without_attachments).", placeholder: "{\"subject\":\"invoice\",\"read_state\":\"unread\"}", label: "Filters"}, {name: limit, widget_type: number, help_text: "Maximum messages per page, from 1 to 200; defaults to 50.", label: "Limit"}, {name: cursor, widget_type: text, help_text: "Leave empty for the first page. For later pages, map next_cursor returned by this search and keep the same connection, filters and page size.", label: "Cursor"}]
  - operation_id: get_message
    title: "Read Gmail message"
    fields: [{name: message_id, widget_type: text, required: true, help_text: "Gmail provider message ID returned by Search Gmail messages; this is not an email Message-ID header.", label: "Message id"}, {name: include_body, widget_type: boolean, help_text: "Include the message body in the result for downstream text processing.", label: "Include body"}, {name: include_headers, widget_type: boolean, help_text: "Include the message headers in the result.", label: "Include headers"}, {name: include_attachment_metadata, widget_type: boolean, help_text: "Include attachment identifiers, filenames and content types so a later download step can select a file.", label: "Include attachment metadata"}, {name: include_raw_html, widget_type: boolean, help_text: "Include the original HTML body when HTML content is needed by a later step.", label: "Include raw html"}]
  - operation_id: get_attachment
    title: "Download Gmail attachment"
    fields: [{name: message_id, widget_type: text, required: true, help_text: "Gmail provider message ID returned by Search Gmail messages; this is not an email Message-ID header.", label: "Message id"}, {name: attachment_id, widget_type: text, required: true, help_text: "Attachment ID from the selected message's attachment metadata. Use it with that same message_id.", label: "Attachment id"}]
  - operation_id: set_message_flags
    title: "Set Gmail read and starred flags"
    fields: [{name: message_ids, widget_type: json, required: true, help_text: "JSON array of Gmail provider message IDs returned by search.", placeholder: "[\"<message_id from search>\"]", label: "Message ids"}, {name: seen, widget_type: boolean, help_text: "Set true to mark messages read or false to mark them unread. Leave empty to preserve read state; provide at least one of seen or flagged.", label: "Seen"}, {name: flagged, widget_type: boolean, help_text: "Set true to star messages or false to remove the star. Leave empty to preserve starred state; provide at least one of seen or flagged.", label: "Flagged"}]
  - operation_id: move_messages
    title: "Move Gmail messages between labels"
    fields: [{name: message_ids, widget_type: json, required: true, help_text: "JSON array of Gmail provider message IDs returned by search.", placeholder: "[\"<message_id from search>\"]", label: "Message ids"}, {name: source_label_id, widget_type: resource_picker, resource_query_id: gmail_move_labels, required: true, help_text: "Select the label to remove from the chosen messages.", label: "Source label id"}, {name: target_label_id, widget_type: resource_picker, resource_query_id: gmail_move_labels, required: true, help_text: "Select the label to add to the chosen messages.", label: "Target label id"}]
  - operation_id: delete_messages
    title: Move Gmail messages to Trash
    fields: [{name: message_ids, widget_type: json, required: true, help_text: "JSON array of Gmail provider message IDs returned by search.", placeholder: "[\"<message_id from search>\"]", label: "Message ids"}]
  - operation_id: search_drive_files
    title: Search Google Drive files
    fields:
      - name: parent_folder_id
        widget_type: resource_picker
        resource_query_id: google_drive_folders
        label: Parent folder
        help_text: Select with Google Picker or map an upstream folder ID.
        external_resource_picker:
          allowed_script_origins: &google_picker_script_origins [https://accounts.google.com, https://apis.google.com]
          allowed_connect_origins: &google_picker_connect_origins [https://accounts.google.com, https://www.googleapis.com]
          allowed_frame_origins: &google_picker_frame_origins [https://accounts.google.com, https://docs.google.com]
          bootstrap_action_id: get_picker_bootstrap
          bridge_global: FlowStewardGoogleWorkspacePicker
          button_label: Choose folder with Google Picker
          busy_label: Opening Google Picker…
          error_message: Google Picker could not apply the selected folder. Reopen it and try again.
          options: {resource_kind: folder}
          scripts: &google_picker_scripts
            - {src: https://accounts.google.com/gsi/client}
            - {src: https://apis.google.com/js/api.js}
            - {asset_ref: assets/google-picker-bridge.js}
          target_component_id: workflow_parameter_form
          selection: {maximum: 1, fields: [{source: id, target: parent_folder_id, required: true, max_length: 1024}]}
      - {name: name, widget_type: text, label: "Filename", help_text: "Filename to match using the chosen exact or contains mode.", placeholder: "invoice"}
      - {name: name_match, widget_type: select, label: Name match, options: [{label: Contains, value: contains}, {label: Exact, value: exact}], help_text: "contains matches part of the filename; exact requires the full filename."}
      - {name: mime_types, widget_type: json, label: MIME types, help_text: "JSON array of MIME type strings used to restrict the search.", placeholder: "[\"application/pdf\"]"}
      - {name: modified_after, widget_type: datetime, label: Modified after, help_text: "Return files modified after this RFC 3339 date and time, including a timezone."}
      - {name: modified_before, widget_type: datetime, label: Modified before, help_text: "Return files modified before this RFC 3339 date and time, including a timezone."}
      - {name: trashed, widget_type: boolean, label: Include only trashed files, help_text: "False searches files outside Trash. True searches only trashed files."}
      - {name: sort, widget_type: select, label: Sort, options: [{label: Provider order, value: provider_order}, {label: Name ascending, value: name_asc}, {label: Modified newest first, value: modified_time_desc}], help_text: "provider_order keeps Drive order; name_asc sorts by filename; modified_time_desc returns newest modified first."}
      - {name: limit, widget_type: number, label: Limit, help_text: "Maximum files per page, from 1 to 100; defaults to 50."}
      - {name: cursor, widget_type: text, label: Cursor, help_text: Map only a cursor returned by this operation with the same filters.}
  - operation_id: download_drive_file
    title: Download Google Drive file
    fields:
      - name: file_id
        widget_type: resource_picker
        resource_query_id: google_drive_files
        label: Drive file (required)
        required: true
        help_text: Select with Google Picker or map an upstream file ID.
        external_resource_picker:
          allowed_script_origins: *google_picker_script_origins
          allowed_connect_origins: *google_picker_connect_origins
          allowed_frame_origins: *google_picker_frame_origins
          bootstrap_action_id: get_picker_bootstrap
          bridge_global: FlowStewardGoogleWorkspacePicker
          button_label: Choose file with Google Picker
          busy_label: Opening Google Picker…
          error_message: Google Picker could not apply the selected file. Reopen it and try again.
          options: {resource_kind: file}
          scripts: *google_picker_scripts
          target_component_id: workflow_parameter_form
          selection: {maximum: 1, fields: [{source: id, target: file_id, required: true, max_length: 1024}]}
      - {name: export_mime_type, widget_type: select, label: Native export format, options: [{label: PDF, value: application/pdf}, {label: Excel workbook, value: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}], help_text: "For a supported Google native file, explicitly select PDF or Excel export as appropriate. Leave empty for ordinary binary files."}
  - operation_id: upload_drive_file
    title: Upload file to Google Drive
    fields:
      - {name: artifact_handle, widget_type: artifact_picker, label: Input artifact (required), required: true, help_text: "Map the file artifact handle returned by an earlier download or file-generation step. The file must be available to this workflow run."}
      - name: destination_folder_id
        widget_type: resource_picker
        resource_query_id: google_drive_folders
        label: Destination folder (required)
        required: true
        help_text: Select a folder with Google Picker or map an upstream folder ID.
        external_resource_picker:
          allowed_script_origins: *google_picker_script_origins
          allowed_connect_origins: *google_picker_connect_origins
          allowed_frame_origins: *google_picker_frame_origins
          bootstrap_action_id: get_picker_bootstrap
          bridge_global: FlowStewardGoogleWorkspacePicker
          button_label: Choose folder with Google Picker
          busy_label: Opening Google Picker…
          error_message: Google Picker could not apply the selected folder. Reopen it and try again.
          options: {resource_kind: folder}
          scripts: *google_picker_scripts
          target_component_id: workflow_parameter_form
          selection: {maximum: 1, fields: [{source: id, target: destination_folder_id, required: true, max_length: 1024}]}
      - {name: filename, widget_type: text, label: Filename (required), required: true, help_text: "Filename for the uploaded artifact, including its extension.", placeholder: "daily-report.pdf"}
  - operation_id: read_google_sheet
    title: Read Google Sheet
    fields:
      - name: spreadsheet_id
        widget_type: resource_picker
        resource_query_id: google_spreadsheets
        label: Spreadsheet (required)
        required: true
        help_text: Select with Google Picker or map an upstream spreadsheet ID.
        external_resource_picker:
          allowed_script_origins: *google_picker_script_origins
          allowed_connect_origins: *google_picker_connect_origins
          allowed_frame_origins: *google_picker_frame_origins
          bootstrap_action_id: get_picker_bootstrap
          bridge_global: FlowStewardGoogleWorkspacePicker
          button_label: Choose spreadsheet with Google Picker
          busy_label: Opening Google Picker…
          error_message: Google Picker could not apply the selected spreadsheet. Reopen it and try again.
          options: {resource_kind: spreadsheet}
          scripts: *google_picker_scripts
          target_component_id: workflow_parameter_form
          selection: {maximum: 1, fields: [{source: id, target: spreadsheet_id, required: true, max_length: 1024}]}
      - {name: sheet_id, widget_type: number, label: Sheet ID, help_text: Enter exactly one of Sheet ID or Sheet title.}
      - {name: sheet_title, widget_type: text, label: Sheet title, help_text: Enter exactly one of Sheet ID or Sheet title.}
      - {name: range, widget_type: text, label: Relative A1 range, help_text: "A1 range relative to the selected sheet, without a sheet prefix. Leave empty for the supported default read range.", placeholder: "A1:D100"}
      - {name: header_mode, widget_type: select, label: Header mode, options: [{label: First row, value: first_row}, {label: No header, value: none}], help_text: "first_row uses the first row as dataset field names; none reads rows without treating the first row as a header."}
  - operation_id: write_google_sheet
    title: "Create or overwrite Google Sheet"
    fields:
      - {name: mode, widget_type: select, label: Mode (required), required: true, options: [{label: Create spreadsheet, value: create}, {label: Overwrite selected sheet range, value: overwrite}], help_text: "create makes a new spreadsheet; overwrite writes to the selected existing sheet starting at start_cell."}
      - {name: dataset_handle, widget_type: dataset_picker, label: Input dataset, help_text: Choose exactly one input dataset or inline rows.}
      - {name: inline_rows, widget_type: json, label: Inline rows, help_text: Choose exactly one input dataset or inline rows; maximum 100 rows., placeholder: "[[\"Order\",\"Total\"],[\"A-100\",42.5]]"}
      - {name: start_cell, widget_type: text, label: Start cell, help_text: "Single A1 cell relative to the selected sheet. Defaults to A1.", placeholder: "A1"}
      - {name: spreadsheet_title, widget_type: text, label: New spreadsheet title, depends_on: {mode: create}, help_text: "Name of the spreadsheet to create in create mode.", placeholder: "Daily order report"}
      - name: destination_folder_id
        widget_type: resource_picker
        resource_query_id: google_drive_folders
        label: Destination folder
        depends_on: {mode: create}
        external_resource_picker:
          allowed_script_origins: *google_picker_script_origins
          allowed_connect_origins: *google_picker_connect_origins
          allowed_frame_origins: *google_picker_frame_origins
          bootstrap_action_id: get_picker_bootstrap
          bridge_global: FlowStewardGoogleWorkspacePicker
          button_label: Choose folder with Google Picker
          busy_label: Opening Google Picker…
          error_message: Google Picker could not apply the selected folder. Reopen it and try again.
          options: {resource_kind: folder}
          scripts: *google_picker_scripts
          target_component_id: workflow_parameter_form
          selection: {maximum: 1, fields: [{source: id, target: destination_folder_id, required: true, max_length: 1024}]}
        help_text: "Select an app-authorized destination folder with Google Picker or map an authorized folder ID."
      - name: spreadsheet_id
        widget_type: resource_picker
        resource_query_id: google_spreadsheets
        label: Spreadsheet
        depends_on: {mode: overwrite}
        external_resource_picker:
          allowed_script_origins: *google_picker_script_origins
          allowed_connect_origins: *google_picker_connect_origins
          allowed_frame_origins: *google_picker_frame_origins
          bootstrap_action_id: get_picker_bootstrap
          bridge_global: FlowStewardGoogleWorkspacePicker
          button_label: Choose spreadsheet with Google Picker
          busy_label: Opening Google Picker…
          error_message: Google Picker could not apply the selected spreadsheet. Reopen it and try again.
          options: {resource_kind: spreadsheet}
          scripts: *google_picker_scripts
          target_component_id: workflow_parameter_form
          selection: {maximum: 1, fields: [{source: id, target: spreadsheet_id, required: true, max_length: 1024}]}
        help_text: "Select an app-authorized spreadsheet with Google Picker or map its ID; use this for overwrite or append operations."
      - {name: sheet_id, widget_type: number, label: Sheet ID, depends_on: {mode: overwrite}, help_text: "Numeric sheet tab ID, zero or greater. Provide exactly one of sheet_id or sheet_title for an existing sheet."}
      - {name: sheet_title, widget_type: text, label: Sheet title, depends_on: {mode: overwrite}, help_text: "Exact sheet tab title. Provide exactly one of sheet_title or sheet_id for an existing sheet."}
  - operation_id: append_google_sheet_rows
    title: Append Google Sheet rows
    fields:
      - name: spreadsheet_id
        widget_type: resource_picker
        resource_query_id: google_spreadsheets
        label: Spreadsheet (required)
        required: true
        external_resource_picker:
          allowed_script_origins: *google_picker_script_origins
          allowed_connect_origins: *google_picker_connect_origins
          allowed_frame_origins: *google_picker_frame_origins
          bootstrap_action_id: get_picker_bootstrap
          bridge_global: FlowStewardGoogleWorkspacePicker
          button_label: Choose spreadsheet with Google Picker
          busy_label: Opening Google Picker…
          error_message: Google Picker could not apply the selected spreadsheet. Reopen it and try again.
          options: {resource_kind: spreadsheet}
          scripts: *google_picker_scripts
          target_component_id: workflow_parameter_form
          selection: {maximum: 1, fields: [{source: id, target: spreadsheet_id, required: true, max_length: 1024}]}
        help_text: "Select an app-authorized spreadsheet with Google Picker or map its ID; use this for overwrite or append operations."
      - {name: sheet_id, widget_type: number, label: Sheet ID, help_text: Enter exactly one of Sheet ID or Sheet title.}
      - {name: sheet_title, widget_type: text, label: Sheet title, help_text: Enter exactly one of Sheet ID or Sheet title.}
      - {name: table_range, widget_type: text, label: Table range (required), required: true, help_text: "Relative A1 range identifying the logical table after which rows are appended.", placeholder: "A:D"}
      - {name: dataset_handle, widget_type: dataset_picker, label: Input dataset, help_text: Choose exactly one input dataset or inline rows.}
      - {name: inline_rows, widget_type: json, label: Inline rows, help_text: Choose exactly one input dataset or inline rows; maximum 100 rows., placeholder: "[[\"Order\",\"Total\"],[\"A-100\",42.5]]"}
